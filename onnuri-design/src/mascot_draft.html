<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="store.css">
<style>
body{width:1500px;background:#FBF6EA;padding:40px 50px;font-family:Pretendard}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:30px}
.card{background:#fff;border-radius:28px;padding:26px 20px 24px;text-align:center}
.card h3{font-size:30px;font-weight:900;letter-spacing:-.04em}
.card p{font-size:19px;color:#6B645A;margin-top:4px}
.poses{display:flex;justify-content:center;gap:10px;margin-top:14px}
.poses svg{width:200px;height:200px;overflow:visible}
</style></head><body>
<div class="row">
 <div class="card"><h3>A · 말랑 집</h3><p>모서리가 둥근 통통한 집, 굴뚝 김 모락</p><div class="poses" id="A"></div></div>
 <div class="card"><h3>B · 지붕 모자 찹쌀떡</h3><p>동글한 떡 몸에 차콜 지붕 모자</p><div class="poses" id="B"></div></div>
 <div class="card"><h3>C · 창문 얼굴</h3><p>집의 둥근 창문 안에서 웃는 얼굴</p><div class="poses" id="C"></div></div>
</div>
<script>
const INK='#2B2620', G='#EBAE1F', GD='#D4951A', CR='#FFF4D6', PK='#FF9EB5';
const face=(cx,cy,s=1)=>`
 <ellipse cx="${cx-14*s}" cy="${cy}" rx="${5.5*s}" ry="${7.5*s}" fill="${INK}"/><ellipse cx="${cx+14*s}" cy="${cy}" rx="${5.5*s}" ry="${7.5*s}" fill="${INK}"/>
 <circle cx="${cx-12*s}" cy="${cy-3*s}" r="${2.2*s}" fill="#fff"/><circle cx="${cx+16*s}" cy="${cy-3*s}" r="${2.2*s}" fill="#fff"/>
 <ellipse cx="${cx-25*s}" cy="${cy+10*s}" rx="${7*s}" ry="${4.2*s}" fill="${PK}" opacity=".85"/><ellipse cx="${cx+25*s}" cy="${cy+10*s}" rx="${7*s}" ry="${4.2*s}" fill="${PK}" opacity=".85"/>
 <path d="M${cx-6*s} ${cy+9*s} Q${cx} ${cy+15*s} ${cx+6*s} ${cy+9*s}" fill="none" stroke="${INK}" stroke-width="${3.6*s}" stroke-linecap="round"/>`;
const arm=(x1,y1,x2,y2,x3,y3)=>`<path d="M${x1} ${y1} Q${x2} ${y2} ${x3} ${y3}" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>`;
const feet=(y,dx=16,c=G)=>`<ellipse cx="${70-dx}" cy="${y}" rx="10" ry="6.5" fill="${c}" stroke="${INK}" stroke-width="4.5"/><ellipse cx="${70+dx}" cy="${y}" rx="10" ry="6.5" fill="${c}" stroke="${INK}" stroke-width="4.5"/>`;
const shadow=y=>`<ellipse cx="70" cy="${y}" rx="40" ry="5" fill="rgba(0,0,0,.10)"/>`;
const sparkle=`<path d="M122 36 l4 -6 M126 46 l8 -1" stroke="${INK}" stroke-width="3.5" stroke-linecap="round"/>`;

// A 말랑 집: 굵은 둥근 테두리로 모서리를 말랑하게, 지붕은 진한 골드
const A=(wave)=>`${shadow(138)}
 <rect x="90" y="24" width="14" height="24" rx="4" fill="${GD}" stroke="${INK}" stroke-width="4.5"/>
 <circle cx="104" cy="14" r="5" fill="#fff" stroke="${INK}" stroke-width="3"/><circle cx="112" cy="6" r="3.5" fill="#fff" stroke="${INK}" stroke-width="2.5"/>
 ${feet(130)}
 <path d="M70 24 L118 62 V112 Q118 122 108 122 H32 Q22 122 22 112 V62 Z" fill="${INK}" stroke="${INK}" stroke-width="14" stroke-linejoin="round"/>
 <path d="M70 24 L118 62 V112 Q118 122 108 122 H32 Q22 122 22 112 V62 Z" fill="${G}" stroke="${G}" stroke-width="5" stroke-linejoin="round"/>
 <path d="M70 24 L118 62 H22 Z" fill="${GD}" stroke="${GD}" stroke-width="5" stroke-linejoin="round"/>
 ${face(70,88)}
 ${arm(20,88,8,96,12,108)} ${wave ? arm(120,84,134,70,130,52)+sparkle : arm(120,88,132,96,128,108)}`;

// B 지붕 모자 찹쌀떡: 동그란 떡 몸 + 차콜 삼각 지붕 모자 + 골드 방울
const B=(wave)=>`${shadow(132)} ${feet(124,18,CR)}
 <ellipse cx="70" cy="90" rx="50" ry="38" fill="${CR}" stroke="${INK}" stroke-width="5"/>
 <path d="M70 18 L114 60 H26 Z" fill="${INK}" stroke="${INK}" stroke-width="10" stroke-linejoin="round"/>
 <path d="M30 60 H110" stroke="${G}" stroke-width="5" stroke-linecap="round"/>
 <circle cx="70" cy="16" r="8" fill="${G}" stroke="${INK}" stroke-width="4"/>
 ${face(70,92)}
 ${arm(22,96,10,102,14,114)} ${wave ? arm(118,92,132,78,128,60)+sparkle : arm(118,96,130,102,126,114)}`;

// C 창문 얼굴: 골드 집 + 차콜 지붕 + 둥근 크림 창문 안에 얼굴
const C=(wave)=>`${shadow(132)} ${feet(124)}
 <path d="M70 20 L118 58 V114 Q118 122 110 122 H30 Q22 122 22 114 V58 Z" fill="${G}" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>
 <path d="M70 14 L126 60 Q128 64 124 66 L70 24 L16 66 Q12 64 14 60 Z" fill="${INK}" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/>
 <circle cx="70" cy="88" r="30" fill="${CR}" stroke="${INK}" stroke-width="4.5"/>
 ${face(70,88,.82)}
 ${arm(20,92,8,100,12,112)} ${wave ? arm(120,88,134,74,130,56)+sparkle : arm(120,92,132,100,128,112)}`;

for (const [id,fn] of [['A',A],['B',B],['C',C]])
  document.getElementById(id).innerHTML = [false,true].map(w=>`<svg viewBox="0 0 140 140">${fn(w)}</svg>`).join('');
</script></body></html>
