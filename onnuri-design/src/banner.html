<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>온누리하우스 배너</title>
<link rel="stylesheet" href="style.css">
<style>
 html{overflow:hidden}
 body{width:1280px;height:480px;background:var(--cream);overflow:hidden;position:relative}
 .sun{position:absolute;right:-60px;top:-110px;width:620px;height:620px;border-radius:50%;background:var(--sun-soft)}
 .l{position:absolute;left:80px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center}
 .l .brand .name{font-size:34px}
 h1{margin-top:34px;font-size:72px;font-weight:900;line-height:1.18;letter-spacing:-.05em}
 h1 em{font-style:normal;color:var(--green)}
 .chips{margin-top:30px;display:flex;gap:12px}
 .chips span{background:var(--green);color:#fff;border-radius:999px;padding:12px 26px;font-size:24px;font-weight:700}
 .house{position:absolute;right:210px;top:150px}
</style></head><body>
<div class="sun"></div>
<img class="house" src="logo.svg" width="180" height="180" alt="">
<div class="l">
 <div class="brand"><img src="logo.svg" width="58" height="58" alt=""><div><div class="name">온누리하우스</div><div class="eng" style="font-size:13px">ONNURI HOUSE</div></div></div>
 <h1>세계의 좋은 물건,<br><em>우리 집 앞까지</em></h1>
 <div class="chips"><span>현지 정식 구매</span><span>꼼꼼한 검수</span><span>안전한 포장</span></div>
</div>
</body></html>
