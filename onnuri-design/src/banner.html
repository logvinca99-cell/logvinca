<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>온누리하우스 배너</title>
<link rel="stylesheet" href="style.css">
<style>
 html{overflow:hidden}
 body{width:1280px;height:480px;background:var(--main);color:#fff;position:relative}
 .l{position:absolute;left:90px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center}
 .l .m{color:rgba(255,255,255,.9)}
 .l .xl{margin-top:10px;font-size:88px}
 .l .xl span{color:var(--point)}
 .chips{margin-top:32px;display:flex;gap:12px}
 .chips span{background:#fff;color:var(--main);border-radius:999px;padding:10px 26px;font-size:var(--s);font-weight:800}
 .logo{position:absolute;right:110px;top:50%;transform:translateY(-50%)}
</style></head><body>
<div class="l">
 <div class="m">해외 좋은 물건, 우리 집 앞까지</div>
 <div class="xl"><span>온누리</span>하우스</div>
 <div class="chips"><span>현지 정식 구매</span><span>꼼꼼한 검수</span><span>안전한 포장</span></div>
</div>
<img class="logo" src="logo-white.svg" width="300" height="300" alt="">
</body></html>
