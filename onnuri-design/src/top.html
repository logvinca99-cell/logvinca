<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>온누리하우스 상단</title>
<link rel="stylesheet" href="style.css">
<style>
  .head { padding: 56px 40px 44px; text-align: center; }
  .head .m { color: var(--gray); margin-bottom: 18px; }
  .trust { margin-top: 36px; display: flex; justify-content: center; gap: 0; background: var(--main-soft); border-radius: 999px; padding: 18px 10px; }
  .trust div { flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--main); font-size: var(--s); font-weight: 800; }
  .trust div + div { border-left: 2px solid var(--line); }
  .trust svg { font-size: var(--m); stroke-width: 2.2; }
  .opt { background: var(--main); color: #fff; text-align: center; padding: 40px 40px 36px; }
  .opt .s { color: rgba(255,255,255,.85); font-weight: 700; }
  .opt .l { margin-top: 8px; }
  .opt .l span { background: #fff; color: var(--main); border-radius: 10px; padding: 0 10px; }
  .opt .down { margin-top: 22px; display: inline-flex; align-items: center; gap: 8px; color: var(--point); font-size: var(--s); font-weight: 800; }
  .opt .down svg { stroke-width: 2.6; }
</style></head>
<body>
<div class="head">
  <div class="m">해외 좋은 물건, 우리 집 앞까지</div>
  <div class="brand"><img src="logo.svg" width="84" height="84" alt=""><div class="name">온누리하우스</div></div>
  <div class="trust">
    <div><svg class="ic" viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>현지 정식 구매</div>
    <div><svg class="ic" viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></svg>꼼꼼한 검수</div>
    <div><svg class="ic" viewBox="0 0 24 24"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/></svg>안전한 포장</div>
  </div>
</div>
<div class="opt">
  <div class="s">옵션 선택, 헷갈리셨죠?</div>
  <div class="l">대표 사진이 아닌<br><span>옵션명·옵션 이미지</span>를 꼭 확인해 주세요</div>
  <div class="down">아래 옵션표를 확인하세요<svg class="ic" viewBox="0 0 24 24"><path d="M12 4v15"/><path d="m6 13 6 6 6-6"/></svg></div>
</div>
</body></html>
