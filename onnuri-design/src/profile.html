<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>온누리하우스 프로필</title>
<link rel="stylesheet" href="style.css">
<style>
 html{overflow:hidden}
 body{width:1000px;height:1000px;background:var(--green);display:grid;place-items:center;overflow:hidden;position:relative}
 .ring{position:absolute;width:820px;height:820px;border-radius:50%;border:60px solid rgba(242,165,65,.12)}
 .c{position:relative;text-align:center}
 .c .name{font-size:96px;font-weight:900;color:#FAF6EE;letter-spacing:-.05em;margin-top:36px}
 .c .eng{font-size:30px;font-weight:700;color:var(--sun);letter-spacing:.36em;margin-top:16px}
</style></head><body>
<div class="ring"></div>
<div class="c"><img src="logo-cream.svg" width="330" height="330" alt=""><div class="name">온누리하우스</div><div class="eng">ONNURI HOUSE</div></div>
</body></html>
