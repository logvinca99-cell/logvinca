<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>라벤더라 이벤트 대표</title><link rel="stylesheet" href="store.css">
<style>html{overflow:hidden} body{width:1200px;height:675px;background:var(--plum);color:#fff;position:relative;overflow:hidden}
.ring{position:absolute;right:-120px;top:-120px;width:620px;height:620px;border-radius:50%;background:#3A2F4A}
.txt{position:absolute;left:96px;top:110px}
.cap{font-weight:900;font-size:44px;letter-spacing:-.03em}
.big{margin-top:10px;font-weight:900;letter-spacing:-.05em;line-height:1;font-size:72px}
.big .num{font-size:170px;color:var(--mark)}
.big .w{color:var(--mark)}
.gift{margin-top:30px;display:inline-flex;align-items:center;gap:14px;background:#fff;color:var(--ink);border-radius:999px;padding:10px 28px 10px 12px;font-weight:900;font-size:32px;letter-spacing:-.03em}
.gift .adp{width:58px;height:58px}
.mascot{position:absolute;right:90px;bottom:90px;width:330px;height:314px}
</style></head><body class="bg"><span class="ring"></span>
<div class="txt"><div class="cap">알림받기 + 리뷰 쓰면</div><div class="big">최대 <span class="num">3,000</span><span class="w">원</span> 혜택</div>
<div class="gift"><svg class="adp" viewBox="0 0 200 200"><circle cx="100" cy="100" r="92" fill="#fff" stroke="#DCD2E8" stroke-width="6"/><circle cx="100" cy="100" r="70" fill="#F1ECF7"/><rect x="88" y="10" width="24" height="14" rx="4" fill="#CFC5DD"/><rect x="88" y="176" width="24" height="14" rx="4" fill="#CFC5DD"/><circle cx="70" cy="100" r="16" fill="#9D93AE"/><circle cx="130" cy="100" r="16" fill="#9D93AE"/><circle cx="65" cy="95" r="5" fill="#F4F0F8"/><circle cx="125" cy="95" r="5" fill="#F4F0F8"/></svg><span>+ 돼지코 어댑터 사은품 증정</span></div></div>
<div class="mascot" data-pose="coupon"></div><script src="mascot.js"></script></body></html>
