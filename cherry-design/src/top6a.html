<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>미스터 체리 상단</title><link rel="stylesheet" href="style4.css"><style> .note2{display:flex;align-items:center;justify-content:center;gap:8px;font-size:21px;font-weight:700;color:#8A7A7D;letter-spacing:-.02em} .note2 .ic{font-size:22px;stroke-width:2}
 body{background:#fff}
 .w{padding:44px 40px 0;display:grid;grid-template-columns:260px 1fr;align-items:center;gap:30px}
 .mascot{width:260px;height:240px}
 .en{font-weight:800;font-size:22px;letter-spacing:.34em;color:var(--r)}
 .nm{font-weight:900;font-size:92px;letter-spacing:-.06em;line-height:1.05;color:var(--ink);margin-top:6px}
 .nm span{color:var(--r)}
 .sl{margin-top:14px;font-weight:700;font-size:27px;color:#555}
 .bar{margin:34px 40px 0;height:6px;border-radius:6px;background:var(--r)}
 .note2{padding:18px 0 30px}
</style></head><body>
<div class="w"><div class="mascot" data-pose="wave"></div>
<div><div class="en">MR. CHERRY</div><div class="nm">미스터 <span>체리</span></div><div class="sl">꼭 필요한 좋은 물건만, 쏙쏙 골라 담았어요</div></div></div>
<div class="bar"></div><div class="note2"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span>주문 후 준비되어 발송되는 상품으로, 받아보시기까지 약 2주 소요됩니다.</span></div><script src="mascot4.js"></script></body></html>
