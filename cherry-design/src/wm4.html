<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>미스터 체리 워터마크 (단순 탭)</title><link rel="stylesheet" href="style4.css">
<style>
 html,body{background:transparent} body{width:320px}
 .wrap{display:inline-block;padding:0 4px 6px}
 .t{display:inline-flex;align-items:center;gap:8px;border-radius:0 0 18px 18px;font-weight:900;letter-spacing:-.05em;line-height:1;white-space:nowrap}
 /* S1 빨간 탭 + 흰 글씨 */
 #s1 .t{background:#E0344B;color:#fff;font-size:28px;padding:14px 26px 16px;box-shadow:0 3px 0 #fff,3px 0 0 #fff,-3px 0 0 #fff,3px 3px 0 #fff,-3px 3px 0 #fff}
 /* S2 빨간 탭 + 흰 원 로고 + 흰 글씨 */
 #s2 .t{background:#E0344B;color:#fff;font-size:27px;padding:10px 24px 12px 12px;box-shadow:0 3px 0 #fff,3px 0 0 #fff,-3px 0 0 #fff,3px 3px 0 #fff,-3px 3px 0 #fff}
 #s2 .ci{width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center}
 /* S3 흰 탭 + 빨간 글씨 + 체리 */
 #s3 .t{background:#fff;color:#E0344B;font-size:28px;padding:10px 24px 12px 18px;box-shadow:0 2px 6px rgba(0,0,0,.18)}
</style></head><body>
<div class="wrap" id="s1"><div class="t">미스터 체리</div></div><br>
<div class="wrap" id="s2"><div class="t"><span class="ci"><img src="logo.svg" width="30" height="30" alt=""></span>미스터 체리</div></div><br>
<div class="wrap" id="s3"><div class="t"><img src="logo.svg" width="34" height="34" alt="">미스터 체리</div></div>
</body></html>
