<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>미스터 체리 상단</title><link rel="stylesheet" href="style4.css">
<style>
 .head{padding:40px 36px 30px;text-align:center}
 .band{position:relative;background:var(--r);color:#fff;padding:42px 36px 44px 290px;min-height:250px}
 .band .mbub{position:absolute;left:40px;top:50%;transform:translateY(-50%);width:220px;height:220px}
 .band small{display:block;font-weight:800;font-size:26px;opacity:.95}
 .band h1{margin-top:6px;font-weight:900;font-size:46px;line-height:1.35;letter-spacing:-0.05em}
 .band h1 em{font-style:normal;background:#fff;color:var(--r);border-radius:10px;padding:0 10px}
 .strip{display:flex;align-items:center;justify-content:center;gap:14px;padding:26px 30px 28px;font-weight:800;font-size:30px;letter-spacing:-0.04em}
 .strip .ic{font-size:38px;color:var(--r)}
 .strip em{font-style:normal;color:var(--r)}
</style></head><body>
<div class="head"><div class="logo"><img src="logo.svg" width="54" height="54" alt=""><span class="name">미스터 체리</span></div></div>
<div class="band"><div class="mbub"><div class="mascot" data-pose="plain"></div></div><small>옵션 선택, 헷갈리셨죠?</small><h1>대표 사진이 아닌<br><em>옵션명·옵션 이미지</em>를<br>꼭 확인해 주세요!</h1></div>
<div class="strip"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span>주문 후 준비되는 상품으로 받아보시기까지 <em>약 2주</em> 소요됩니다</span></div>
<script src="mascot4.js"></script></body></html>
