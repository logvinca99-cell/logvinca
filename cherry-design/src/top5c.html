<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>미스터 체리 상단</title><link rel="stylesheet" href="style4.css"><style>
 body{background:var(--r)}
 .w{position:relative;padding:34px 40px 40px;color:#fff;display:grid;grid-template-columns:1fr 240px;align-items:center}
 .logo .name{color:#fff}
 .h{margin-top:22px;font-weight:800;font-size:30px}
 .big{display:flex;align-items:baseline;gap:10px;font-weight:900;letter-spacing:-.05em;line-height:1}

 .sub{white-space:nowrap;margin-top:14px;display:inline-block;background:#fff;color:var(--r);border-radius:999px;padding:8px 24px;font-weight:800;font-size:24px}

<div class="mbub"><div class="mascot" data-pose="wave"></div></div></div><script src="mascot4.js"></script></body></html>
