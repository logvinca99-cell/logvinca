<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>미스터 체리 리본 워터마크 (위에 딱 붙임)</title><link rel="stylesheet" href="style4.css">
<style>
 html,body{background:transparent} body{width:300px}
 .wrap{display:inline-block;padding:0 4px 4px}
 .nm{font-weight:900;letter-spacing:-.05em;line-height:1;white-space:nowrap;color:#fff}
 /* 흰 테두리는 옆·아래만 (윗변은 썸네일 가장자리에 붙음) */
 .out{background:#fff;padding:0 3px 3px}

 /* F1 바느질 리본 */
 #f1 .out,#f1 .s{clip-path:polygon(0 0,100% 0,100% 100%,50% 88%,0 100%)}
 #f1 .s{position:relative;width:180px;background:var(--r);text-align:center;padding:12px 0 30px}
 #f1 .st{position:absolute;left:6px;right:6px;top:-2px;bottom:0;border:2px dashed rgba(255,255,255,.65);border-top:0;border-bottom:0}
 #f1 .cb{width:62px;height:62px;margin:0 auto;border-radius:50%;background:#fff;display:grid;place-items:center}
 #f1 .mascot{width:52px;height:48px;margin-top:3px}
 #f1 .nm{font-size:24px;margin-top:8px}

 /* F2 캐릭터가 리본 끝에 매달림 */
 #f2 .s{position:relative;z-index:0;width:180px;text-align:center}
 #f2 .out,#f2 .rb{clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%)}
 #f2 .rb{background:var(--r);padding:12px 0 24px}
 #f2 .nm{font-size:25px}
 #f2 .mascot{position:relative;z-index:-1;width:92px;height:85px;margin:-30px auto 0}

 /* F3 둥근 배지 */
 #f3 .s{width:180px}
 #f3 .bd{background:var(--r);border-radius:0 0 90px 90px;text-align:center;padding:12px 0 22px;box-shadow:3px 0 0 #fff,-3px 0 0 #fff,0 3px 0 #fff,3px 3px 0 #fff,-3px 3px 0 #fff}
 #f3 .cb{width:62px;height:62px;margin:0 auto;border-radius:50%;background:#fff;display:grid;place-items:center}
 #f3 .mascot{width:52px;height:48px;margin-top:3px}
 #f3 .nm{font-size:24px;margin-top:8px}
</style></head><body>
<div class="wrap" id="f1"><div class="out"><div class="s"><span class="st"></span><div class="cb"><div class="mascot" data-pose="plain"></div></div><div class="nm">미스터 체리</div></div></div></div><br>
<div class="wrap" id="f2"><div class="s"><div class="out"><div class="rb"><div class="nm">미스터 체리</div></div></div><div class="mascot" data-pose="wave"></div></div></div><br>
<div class="wrap" id="f3"><div class="s"><div class="bd"><div class="cb"><div class="mascot" data-pose="plain"></div></div><div class="nm">미스터 체리</div></div></div></div>
<script src="mascot4.js"></script></body></html>
