<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>미스터 체리 프로모션 2</title><link rel="stylesheet" href="store.css">
<style>html{overflow:hidden} body{position:relative;overflow:hidden}
body.pc{width:1920px;height:400px} body.m{width:750px;height:600px}
.pc .in{position:absolute;left:360px;right:360px;top:0;bottom:0}
.m .in{position:absolute;left:40px;right:40px;top:0;bottom:0}
.mascot{position:absolute}
.cs{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:-.02em}
.cs svg{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linejoin:round;width:22px;height:22px}
.cs .num{letter-spacing:.02em}
.pc .cs{font-size:21px} .pc .cs .num{font-size:24px}
.m .cs{font-size:19px} .m .cs .num{font-size:22px}
.pc .mbr{display:none}
body{background:var(--mark)}
.burst{position:absolute;border-radius:50%;background:#FFD56B}
.pc .burst{width:620px;height:620px;right:180px;top:-110px} .m .burst{width:520px;height:520px;right:-170px;top:-60px}
.txt{position:absolute;left:0}
.pc .txt{top:40px} .m .txt{top:44px}
.cap{font-weight:900;color:var(--ink);letter-spacing:-.03em} .pc .cap{font-size:30px} .m .cap{font-size:28px}
.big{color:var(--ink);font-weight:900;letter-spacing:-.05em;line-height:1}
.big .num{color:var(--plum)} .pc .big{font-size:60px;margin-top:6px} .m .big{font-size:52px;margin-top:10px}
.pc .big .num{font-size:118px} .m .big .num{font-size:112px}
.eq{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pc .eq{margin-top:14px} .m .eq{margin-top:18px;width:430px}
.chip{background:#fff;border:3px solid var(--ink);border-radius:999px;font-weight:900;letter-spacing:-.03em;color:var(--ink);white-space:nowrap}
.chip b{color:var(--plum)}
.pc .chip{font-size:22px;padding:5px 16px} .m .chip{font-size:20px;padding:5px 14px}
.plus{font-weight:900;color:var(--ink)} .pc .plus{font-size:26px} .m .plus{font-size:24px}
.gift{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--ink)}
.pc .gift{margin-top:12px;font-size:22px} .m .gift{margin-top:16px;font-size:21px}
.gift .adp{width:34px;height:34px}
.pc .mascot{right:40px;top:70px;width:270px;height:257px} .m .mascot{right:0;bottom:20px;width:230px;height:219px}
.st{position:absolute;background:var(--plum);color:#fff;font-weight:900;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1;transform:rotate(12deg);letter-spacing:-.03em}
.pc .st{right:300px;top:46px;width:112px;height:112px;font-size:22px} .m .st{right:206px;bottom:210px;width:100px;height:100px;font-size:20px}
</style></head><body class="__SIZE__"><span class="burst"></span><div class="in">
 <div class="txt">
  <div class="cap">알림받기 + 리뷰 쓰면</div>
  <div class="big">최대 <span class="num">3,000</span>원 혜택</div>
  <div class="eq"><span class="chip">알림받기 <b>1,000원</b> 할인</span><span class="plus">+</span><span class="chip">리뷰 최대 <b>2,000원</b> 적립</span></div>
  <div class="gift"><svg class="adp" viewBox="0 0 200 200"><circle cx="100" cy="100" r="92" fill="#fff" stroke="#F3C9CF" stroke-width="6"/><circle cx="100" cy="100" r="70" fill="#FFF0F2"/><rect x="88" y="10" width="24" height="14" rx="4" fill="#E8C3C9"/><rect x="88" y="176" width="24" height="14" rx="4" fill="#E8C3C9"/><circle cx="70" cy="100" r="16" fill="#B08A90"/><circle cx="130" cy="100" r="16" fill="#B08A90"/><circle cx="65" cy="95" r="5" fill="#FFF5F6"/><circle cx="125" cy="95" r="5" fill="#FFF5F6"/></svg><span>+ 220V 돼지코 어댑터 증정</span></div>
 </div>
 <div class="st">최대<br>3천원</div><div class="mascot" data-pose="coupon"></div>
</div><script src="mascot4.js"></script></body></html>
