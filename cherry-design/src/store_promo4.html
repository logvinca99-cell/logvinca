<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>미스터 체리 프로모션 4 리뷰왕</title><link rel="stylesheet" href="store.css">
<style>
html{overflow:hidden} body{position:relative;overflow:hidden;background:#E0344B;color:#fff}
body.pc{width:1920px;height:400px} body.m{width:750px;height:600px}
.pc .in{position:absolute;left:360px;right:360px;top:0;bottom:0} .m .in{position:absolute;left:40px;right:40px;top:0;bottom:0}
/* 반짝이 점 */
.dot{position:absolute;border-radius:50%}
.txt{position:absolute;left:0}
.pc .txt{top:78px} .m .txt{top:44px}
.tag{display:inline-flex;align-items:center;gap:8px;background:var(--mark);color:var(--ink);font-weight:900;border-radius:999px;letter-spacing:-.02em}
.pc .tag{font-size:22px;padding:6px 18px} .m .tag{font-size:21px;padding:6px 16px}
.h{font-weight:900;letter-spacing:-.05em;line-height:1.08}
.pc .h{font-size:66px;margin-top:16px} .m .h{font-size:68px;margin-top:18px}
.h .y{color:var(--mark)}
.sub{font-weight:700;color:rgba(255,255,255,.88);letter-spacing:-.02em;line-height:1.45}
.pc .sub{font-size:24px;margin-top:14px} .m .sub{font-size:23px;margin-top:18px}
/* 상금 쿠폰 */
.cp{position:absolute;background:#fff;color:var(--ink);border-radius:22px;display:grid;grid-template-columns:auto 1fr;box-shadow:0 8px 0 rgba(0,0,0,.18)}
.pc .cp{right:0;top:166px;width:330px} .m .cp{left:0;bottom:44px;width:400px}
.cp .l{background:var(--mark);border-radius:22px 0 0 22px;display:grid;place-items:center;padding:0 16px;font-weight:900;font-size:20px;line-height:1.2;text-align:center;color:var(--ink)}
.cp .r{border-left:4px dashed #F3C9CF;padding:16px 22px 18px}
.cp .k{font-weight:700;font-size:20px;color:var(--gray)}
.cp .v{font-weight:900;font-size:30px;letter-spacing:-.04em;line-height:1}
.cp .v .num{font-size:60px;color:var(--plum)}
.mascot{position:absolute}
.pc .mascot{right:372px;top:134px;width:180px;height:171px} .m .mascot{right:10px;bottom:40px;width:220px;height:210px}
.pc .mbr{display:none}
</style></head><body class="__SIZE__">
<span class="dot" style="left:6%;top:18%;width:14px;height:14px;background:var(--mark)"></span>
<span class="dot" style="left:12%;top:72%;width:10px;height:10px;background:#FFD9DF"></span>
<span class="dot" style="right:8%;top:14%;width:12px;height:12px;background:#FFD9DF"></span>
<span class="dot" style="right:14%;top:80%;width:16px;height:16px;background:var(--mark)"></span>
<div class="in">
 <div class="txt">
  <span class="tag">👑 매달 베스트 리뷰 선정</span>
  <div class="h">이달의 <span class="y">리뷰왕</span>을<br class="mbr"> 찾아요!</div>
  <div class="sub">구매 금액 상관없이 리뷰만 정성껏 써주세요.<br>베스트 리뷰로 뽑히면 네이버페이 포인트를 드려요.</div>
 </div>
 <div class="mascot mb" data-pose="king"></div>
 <div class="cp"><div class="l">리뷰왕<br>상금</div><div class="r"><div class="k">네이버페이 포인트</div><div class="v"><span class="num">10,000</span>원</div></div></div>
</div><script src="mascot4.js"></script></body></html>
