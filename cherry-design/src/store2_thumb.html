<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>미스터 체리 팝업</title><link rel="stylesheet" href="store2.css"><style>
 body{width:1200px;height:675px;background:var(--r)}
 .box{position:absolute;left:44px;right:44px;top:70px;bottom:44px;border-color:#fff}
 .box>.tt{background:var(--bt);color:var(--ink);font-size:34px;padding:10px 40px}
 .c{position:absolute;left:0;right:330px;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
 .big{font-weight:900;font-size:96px;letter-spacing:-.05em;line-height:1.05}
 .eq{display:flex;align-items:center;gap:12px;margin-top:22px;font-weight:900;font-size:28px}
 .eq span{background:var(--rl);border-radius:14px;padding:8px 18px;white-space:nowrap} .eq i{font-style:normal;color:var(--r)}
 .gift{display:flex;align-items:center;gap:10px;margin-top:18px;font-weight:800;font-size:26px;color:var(--gray)} .gift .adp{width:40px;height:40px}
 .mbub{position:absolute;right:56px;top:50%;width:270px;height:270px;margin-top:-135px;background:var(--rl);box-shadow:none}
</style></head><body>
<div class="box"><div class="tt">알림받기 + 리뷰 쓰면</div>
<div class="c"><div class="big">최대 <span class="r">3,000원</span><br>혜택</div>
<div class="eq"><span>알림받기 <i>1,000원</i> 할인</span><b>+</b><span>리뷰 최대 <i>2,000원</i> 적립</span></div>
<div class="gift"><svg class="adp" viewBox="0 0 200 200"><circle cx="100" cy="100" r="92" fill="#fff" stroke="#F3C9CF" stroke-width="8"/><circle cx="100" cy="100" r="70" fill="#FFF0F2"/><rect x="88" y="10" width="24" height="14" rx="4" fill="#E8C3C9"/><rect x="88" y="176" width="24" height="14" rx="4" fill="#E8C3C9"/><circle cx="70" cy="100" r="16" fill="#B08A90"/><circle cx="130" cy="100" r="16" fill="#B08A90"/></svg>+ 돼지코 어댑터 사은품 증정</div></div>
<div class="mbub"><div class="mascot" data-pose="coupon"></div></div></div><script src="mascot4.js"></script></body></html>
