<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>미스터 체리 상단</title><link rel="stylesheet" href="style2.css">
<style>
 body{background:var(--cream)}
 .band{height:56px}
 .scallop{--sc:var(--cream)}
 .w{position:relative;padding:22px 44px 46px}
 .clogo .name{font-size:30px}
 .h{font-size:58px;margin-top:18px;line-height:1.25}
 .h .mk{position:relative;color:var(--red);white-space:nowrap}
 .h .mk::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:14px;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 14'><path d='M0 7 Q5 0 10 7 T20 7 T30 7 T40 7' fill='none' stroke='%23E23D55' stroke-width='3.5'/></svg>") repeat-x;background-size:40px 14px}
 .stk{position:absolute;right:56px;top:62px;width:214px;height:214px;transform:rotate(8deg)}
 .stk small{font-size:22px;font-weight:700;opacity:.92}
 .stk b{font-family:"Jua";font-weight:400;font-size:70px;line-height:1.02;color:var(--butter)}
 .mascot{position:absolute;right:20px;bottom:10px;width:150px;height:138px}
 .down{display:inline-block;margin-top:22px;font-family:"Jua";font-size:28px;color:var(--gray)}
</style></head><body>
<div class="band ging"></div><div class="scallop"></div>
<div class="w">
 <div class="clogo"><img src="logo.svg" width="52" height="52" alt=""><span class="name">미스터 체리</span></div>
 <div class="h jua">대표 사진 말고<br><span class="mk">옵션명·옵션 이미지</span>를<br>꼭 확인해 주세요</div>
 <div class="stk"><small>받아보시기까지</small><b>약 2주</b><small>소요됩니다</small></div>
 <div class="mascot" data-pose="plain"></div>
</div>
<script src="mascot.js"></script></body></html>
