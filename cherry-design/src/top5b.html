<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>미스터 체리 상단</title><link rel="stylesheet" href="style4.css"><style>
 .w{position:relative;padding:36px 40px 40px;display:grid;grid-template-columns:300px 1fr;gap:76px;align-items:center}
 .cal{position:relative;background:#fff;border:5px solid var(--r);border-radius:28px;overflow:hidden;text-align:center;box-shadow:0 8px 0 var(--line)}
 .cal .hd{background:var(--r);color:#fff;font-weight:900;font-size:26px;padding:12px 0;letter-spacing:.02em}
 .cal .hd::before,.cal .hd::after{content:"";position:absolute;top:-12px;width:14px;height:36px;border-radius:8px;background:var(--rd)}
 .cal .hd::before{left:70px}.cal .hd::after{right:70px}
 .cal .d{font-weight:900;font-size:150px;line-height:1;color:var(--r);letter-spacing:-.04em;padding:18px 0 0}
 .cal .d small{font-size:50px;color:var(--ink)}
 .cal .f{font-weight:800;font-size:22px;color:var(--gray);padding:6px 0 20px}
 .h{font-weight:900;font-size:48px;letter-spacing:-.05em;line-height:1.3;margin-top:16px}
 .h em{font-style:normal;color:#fff;background:var(--r);border-radius:10px;padding:0 10px}
 .sub{margin-top:12px;font-weight:700;font-size:25px;color:var(--gray)}
 .mascot{position:absolute;left:282px;bottom:30px;width:116px;height:107px}
</style></head><body><div class="w"><div class="cal"><div class="hd">주문 후</div><div class="d">14<small>일</small></div><div class="f">영업일 기준 7~15일</div></div>
<div><div class="logo"><img src="logo.svg" width="50" height="50" alt=""><span class="name" style="font-size:30px">미스터 체리</span></div><div class="h">받아보시기까지<br><em>약 2주</em> 소요됩니다</div><div class="sub">주문 후 준비되어 발송되는 상품이에요</div></div>
<div class="mascot" data-pose="wave"></div></div><script src="mascot4.js"></script></body></html>
