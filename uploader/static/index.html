<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>업스타</title>
<link rel="icon" type="image/svg+xml" href="/static/logo.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <img class="brand-logo" src="/static/logo.svg" alt="">
      <div><div class="brand-name">업스타</div><div class="brand-sub">여러 스토어 상품 등록</div></div>
    </div>
    <nav>
      <a href="#home" data-page="home" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>한눈에 보기</a>
      <a href="#clean" data-page="clean" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M5 4h10l4 4v12H5z"/><path d="M15 4v4h4M8 12h8M8 16h5"/></svg>상세 정리</a>
      <a href="#inventory" data-page="inventory" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M4 7l8-4 8 4-8 4zM4 12l8 4 8-4M4 17l8 4 8-4"/></svg>원본 상품</a>
      <a href="#listings" data-page="listings" class="nav-item">
        <svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>복사본</a>
      <a href="#lexicon" data-page="lexicon" class="nav-item">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M6.5 6.5l11 11"/></svg>금지어</a>
      <a href="#orders" data-page="orders" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M4 5h2l2 10h10l2-7H7"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/></svg>판매 현황</a>
      <a href="#stores" data-page="stores" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M4 9l2-5h12l2 5M4 9v11h16V9M4 9h16M9 20v-6h6v6"/></svg>스토어</a>
      <a href="#mail" data-page="mail" class="nav-item">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>메일함<span class="nav-badge" id="nav-mail" hidden></span></a>
      <a href="#runs" data-page="runs" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M12 7v5l3 2"/><circle cx="12" cy="12" r="8"/></svg>실행 기록</a>
      <a href="#trash" data-page="trash" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>휴지통</a>
      <a href="#help" data-page="help" class="nav-item">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M9.6 9.5a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .8-1 1.5v.4M12 16.8v.2"/></svg>용어 설명</a>
      <a href="#settings" data-page="settings" class="nav-item">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.4 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.4-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.2-.8.2-1.2z"/></svg>설정</a>
    </nav>
    <div class="side-run" id="side-run" hidden></div>
    <div class="side-foot">
      <div id="conn" class="conn"></div>
      <div class="side-stats" id="side-stats"></div>
    </div>
  </aside>
  <main id="view"></main>
</div>

<div class="drawer-bg" id="drawer-bg" hidden></div>
<aside class="drawer" id="drawer" hidden>
  <header class="drawer-head">
    <div><div class="muted small" id="d-sub"></div><h2 id="d-title"></h2></div>
    <button class="icon-btn" id="d-close" aria-label="닫기">✕</button>
  </header>
  <div class="tabs" id="d-tabs"></div>
  <div class="drawer-body" id="d-body"></div>
  <footer class="drawer-foot" id="d-foot"></footer>
</aside>

<div class="modal-bg" id="modal-bg" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <header class="modal-head"><h2 id="m-title"></h2><button class="icon-btn" id="m-close" aria-label="닫기">✕</button></header>
    <div class="modal-body" id="m-body"></div>
    <footer class="modal-foot" id="m-foot"></footer>
  </div>
</div>

<div class="tasks" id="tasks"></div>
<div class="toast" id="toast" hidden></div>

<script src="/static/js/core.js"></script>
<script src="/static/js/home.js"></script>
<script src="/static/js/clean.js"></script>
<script src="/static/js/inventory.js"></script>
<script src="/static/js/adopt.js"></script>
<script src="/static/js/eye.js"></script>
<script src="/static/js/listings.js"></script>
<script src="/static/js/stores.js"></script>
<script src="/static/js/orders.js"></script>
<script src="/static/js/lexicon.js"></script>
<script src="/static/js/runs.js"></script>
<script src="/static/js/mail.js"></script>
<script src="/static/js/settings.js"></script>
<script src="/static/js/trash.js"></script>
<script src="/static/js/help.js"></script>
<script>App.init();</script>
</body>
</html>
