<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>에이바우트 프로필</title><link rel="stylesheet" href="store.css">
<style>html{overflow:hidden} body{width:1000px;height:1000px;background:var(--plum)} svg{display:block;width:1000px;height:1000px}</style></head><body>
<svg viewBox="0 0 1000 1000"><text class="ctr" style="font-family:Inst;font-style:italic" font-size="600" fill="#fff">a</text><circle cx="500" cy="770" r="38" fill="#FFE45C"/></svg>
<script>document.fonts.ready.then(()=>{const c=document.createElement('canvas').getContext('2d');const el=document.querySelector('.ctr');c.font='italic 400 600px Inst';const m=c.measureText('a');el.setAttribute('x',500-(m.actualBoundingBoxRight-m.actualBoundingBoxLeft)/2);el.setAttribute('y',455+(m.actualBoundingBoxAscent-m.actualBoundingBoxDescent)/2);});</script>
</body></html>
