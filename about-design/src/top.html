<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>에이바우트 상단</title><link rel="stylesheet" href="style.css">
<style>
 body{background:var(--plum)}
 .w{padding:36px 40px 40px}
 .tk{position:relative;background:#fff;border-radius:28px;display:grid;grid-template-columns:1fr 250px}
 .tk::before,.tk::after{content:"";position:absolute;right:232px;width:36px;height:36px;border-radius:50%;background:var(--plum)}
 .tk::before{top:-18px} .tk::after{bottom:-18px}
 .l{padding:30px 34px 34px}
 .l .t{margin-top:26px;font-size:46px}
 .l .t em{font-style:normal;color:var(--plum)}
 .r{border-left:4px dashed #CFC8DA;padding:30px 0 30px;text-align:center;display:flex;flex-direction:column;justify-content:center}
 .r .s{font-weight:700;font-size:var(--c);color:var(--gray)}
 .r .num{font-size:150px;color:var(--plum);margin-top:6px}
 .r .u{font-weight:900;font-size:40px;letter-spacing:-.03em}
</style></head><body><div class="w">
 <div class="tk">
  <div class="l"><div class="logo"><span class="mark">a<i>.</i></span><span class="name">에이바우트</span></div><div class="t">대표 사진 말고<br><em>옵션명·옵션 이미지</em>를<br>꼭 확인해 주세요</div></div>
  <div class="r"><div class="s">받아보시기까지</div><div class="num">2</div><div class="u">약 2주</div></div>
 </div>
</div></body></html>
