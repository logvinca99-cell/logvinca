<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>에이바우트 상단</title>
<link rel="stylesheet" href="style.css">
<style>
  .hero { background: var(--ink); color: #fff; padding: 36px 48px 40px; }
  .bar { display: flex; justify-content: space-between; align-items: center; }
  .bar .en { font-size: 34px; color: var(--mark); }
  .hero .chat { margin-top: 32px; }
  .hero .q { background: #fff; color: var(--ink); }
  /* 핵심 문구: 말풍선이 아니라 화면 폭 전체에 크게 */
  .big { margin-top: 20px; font-weight: 900; font-size: 60px; line-height: 1.22; letter-spacing: -0.045em; }
  .foot { margin-top: 30px; padding-top: 24px; border-top: 1px solid rgba(255,255,255,.25); display: flex; justify-content: space-between; align-items: baseline; }
  .foot .dn { font-size: var(--c); font-weight: 700; color: var(--mark); white-space: nowrap; }
</style></head>
<body>
<div class="hero">
  <div class="bar"><div class="logo"><span class="mark">a<i>.</i></span><span class="name">에이바우트</span></div><span class="en">before you order</span></div>
  <div class="chat"><p class="q">옵션 선택, 헷갈리셨죠?</p></div>
  <div class="big">대표 사진 말고<br><span class="y">옵션명·옵션 이미지</span>를<br>꼭 확인해 주세요</div>
  <div class="foot"><span class="t">받아보시기까지 <span class="y">약 2주</span> 걸려요</span><span class="dn">아래 옵션표 ↓</span></div>
</div>
</body></html>
