<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>에이바우트 상단</title>
<link rel="stylesheet" href="style.css">
<style>
  .head { padding: 36px 40px 32px; }
  .head .brand .name { font-size: var(--l); }
  .opt { background: var(--dark); color: #fff; text-align: center; padding: 44px 40px 40px; }
  .opt .s { color: rgba(255,255,255,.8); font-weight: 700; }
  .opt .l { margin-top: 8px; }
  .opt .l span { background: var(--lilac); color: var(--ink); border-radius: 10px; padding: 0 10px; }
  .ship { margin-top: 30px; display: inline-flex; align-items: center; gap: 12px; border: 2px solid rgba(217,200,255,.45); border-radius: 999px; padding: 10px 28px; }
  .ship svg { font-size: var(--m); color: var(--lilac); stroke-width: 2.2; }
  .ship b { color: var(--lilac); }
  .opt .down { margin-top: 22px; display: flex; justify-content: center; align-items: center; gap: 8px; color: var(--lilac); font-size: var(--s); font-weight: 800; }
  .opt .down svg { stroke-width: 2.6; }
</style></head>
<body>
<div class="head"><div class="brand"><img src="logo.svg" width="56" height="56" alt=""><div class="name">에이바우트</div></div></div>
<div class="opt">
  <div class="s">옵션 선택, 헷갈리셨죠?</div>
  <div class="l">대표 사진이 아닌<br><span>옵션명·옵션 이미지</span>를 꼭 확인해 주세요</div>
  <div class="ship m"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>주문 후 준비되는 상품으로 <b>약 2주</b> 걸려요</span></div>
  <div class="down">아래 옵션표를 확인하세요<svg class="ic" viewBox="0 0 24 24"><path d="M12 4v15"/><path d="m6 13 6 6 6-6"/></svg></div>
</div>
</body></html>
