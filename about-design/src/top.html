<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>에이바우트 상단</title>
<link rel="stylesheet" href="style.css">
<style>
  .hero { background: var(--ink); color: #fff; padding: 36px 48px 44px; }
  .bar { display: flex; justify-content: space-between; align-items: center; }
  .bar .en { font-size: 34px; color: var(--mark); }
  .hero .chat { margin-top: 32px; }
  .hero .q { background: #fff; color: var(--ink); }
  .strip { background: var(--mark); color: var(--ink); padding: 18px 48px; display: flex; justify-content: space-between; align-items: center; font-weight: 700; }
  .strip .dn { font-weight: 900; white-space: nowrap; }
</style></head>
<body>
<div class="hero">
  <div class="bar"><div class="logo"><span class="mark">a<i>.</i></span><span class="name">에이바우트</span></div><span class="en">before you order</span></div>
  <div class="chat">
    <p class="q">옵션 선택, 헷갈리셨죠?</p>
    <p class="a t">대표 사진이 아닌<br><span class="y">옵션명·옵션 이미지</span>를<br>꼭 확인해 주세요</p>
  </div>
</div>
<div class="strip"><span>주문 후 준비되는 상품 · 약 2주 소요</span><span class="dn">아래 옵션표 ↓</span></div>
</body></html>
