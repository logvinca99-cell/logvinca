<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>에이바우트 상단</title>
<link rel="stylesheet" href="style.css">
<style>
  .cover { border-top: 14px solid var(--plum); padding: 30px 48px 44px; }
  .bar { display: flex; justify-content: space-between; align-items: center; }
  .bar .en { font-size: 34px; color: var(--plum); }
  .q { margin-top: 44px; font-weight: 700; color: var(--plum); }
  .cover .t { margin-top: 6px; }
  .cover .d { margin: 2px 0 4px -4px; }
  .strip { background: var(--ink); color: #fff; padding: 22px 48px; display: flex; justify-content: space-between; align-items: center; }
  .strip b { color: var(--mark); }
  .strip .dn { font-size: var(--c); font-weight: 700; color: var(--mark); white-space: nowrap; }
</style></head>
<body>
<div class="cover">
  <div class="bar"><div class="logo"><span class="mark">a<i>.</i></span><span class="name">에이바우트</span></div><span class="en">before you order</span></div>
  <div class="c q">옵션 선택, 헷갈리셨죠?</div>
  <div class="t">대표 사진이 아닌</div>
  <div class="d"><span class="hl">옵션명·옵션 이미지</span></div>
  <div class="t">를 꼭 확인해 주세요</div>
</div>
<div class="strip"><span>주문 후 준비되는 상품 · <b>약 2주</b> 소요</span><span class="dn">아래 옵션표 ↓</span></div>
</body></html>
