<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>에이바우트 원형 워터마크 (글자 정리)</title>
<link rel="stylesheet" href="style.css">
<style>
 html,body{background:transparent}
 body{width:260px;line-height:1}
 .wrap{display:inline-block;padding:6px}
 svg{display:block;width:204px;height:204px}
 .A{font-family:"Inst";font-style:italic;fill:#fff}
 .dot{fill:#FFE45C}
 .k{font-family:"Wanted";font-weight:700;fill:#fff}
 .k5{font-family:"Wanted";font-weight:500;fill:#fff}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
 <path id="bot" d="M 19 102 A 83 83 0 0 0 185 102"/>
 <path id="top" d="M 32 102 A 70 70 0 0 1 172 102"/>
 <path id="full" d="M 102 185 A 83 83 0 1 1 102.01 185"/>
 <path id="botO" d="M 12 102 A 90 90 0 0 0 192 102"/>
 <path id="topO" d="M 25 102 A 77 77 0 0 1 179 102"/>
</defs></svg>

<!-- 1 아래쪽 둥근 글자 -->
<div class="wrap" id="c1"><svg viewBox="0 0 204 204"><circle cx="102" cy="102" r="100" fill="#553C8B" stroke="#fff" stroke-width="3"/>
 <text class="A" x="96" y="118" font-size="124" text-anchor="middle">a<tspan class="dot">.</tspan></text>
 <text class="k" font-size="19" letter-spacing="6"><textPath href="#bot" startOffset="50%" text-anchor="middle">에이바우트</textPath></text></svg></div><br>

<!-- 2 위쪽 둥근 글자 -->
<div class="wrap" id="c2"><svg viewBox="0 0 204 204"><circle cx="102" cy="102" r="100" fill="#553C8B" stroke="#fff" stroke-width="3"/>
 <text class="k" font-size="19" letter-spacing="6"><textPath href="#top" startOffset="50%" text-anchor="middle">에이바우트</textPath></text>
 <text class="A" x="97" y="150" font-size="114" text-anchor="middle">a<tspan class="dot">.</tspan></text></svg></div><br>

<!-- 3 위 한글 + 아래 영문 (둘 다 바로 섬) -->
<div class="wrap" id="c3"><svg viewBox="0 0 204 204"><circle cx="102" cy="102" r="100" fill="#553C8B" stroke="#fff" stroke-width="3"/>
 <text class="k" font-size="17" letter-spacing="6"><textPath href="#topO" startOffset="50%" text-anchor="middle">에이바우트</textPath></text>
 <text class="k" font-size="14" letter-spacing="8"><textPath href="#botO" startOffset="50%" text-anchor="middle">ABOUT</textPath></text>
 <circle cx="20" cy="102" r="3" class="dot"/><circle cx="184" cy="102" r="3" class="dot"/>
 <text class="A" x="97" y="136" font-size="112" text-anchor="middle">a<tspan class="dot">.</tspan></text></svg></div><br>

<!-- 4 가늘고 넓은 자간의 곧은 글자 -->
<div class="wrap" id="c4"><svg viewBox="0 0 204 204"><circle cx="102" cy="102" r="100" fill="#553C8B" stroke="#fff" stroke-width="3"/>
 <text class="A" x="96" y="118" font-size="124" text-anchor="middle">a<tspan class="dot">.</tspan></text>
 <text class="k5" x="105" y="158" font-size="16" letter-spacing="7" text-anchor="middle">에이바우트</text></svg></div><br>

<!-- 5 흰 테 두른 배지: 테 안에 보라 글자 -->
<div class="wrap" id="c5"><svg viewBox="0 0 204 204"><circle cx="102" cy="102" r="100" fill="#fff" stroke="#553C8B" stroke-width="3"/>
 <circle cx="102" cy="102" r="70" fill="#553C8B"/>
 <text class="k" style="fill:#553C8B" font-size="17" letter-spacing="6"><textPath href="#botO" startOffset="50%" text-anchor="middle">에이바우트</textPath></text>
 <text class="k" style="fill:#553C8B" font-size="15" letter-spacing="7"><textPath href="#topO" startOffset="50%" text-anchor="middle">ABOUT</textPath></text>
 <text class="A" x="97" y="136" font-size="112" text-anchor="middle">a<tspan class="dot">.</tspan></text></svg></div><br>

<!-- 6 영문 필기체 about -->
<div class="wrap" id="c6"><svg viewBox="0 0 204 204"><circle cx="102" cy="102" r="100" fill="#553C8B" stroke="#fff" stroke-width="3"/>
 <text class="A" x="102" y="124" font-size="72" text-anchor="middle">about<tspan class="dot">.</tspan></text>
 <text class="k5" x="105" y="156" font-size="15" letter-spacing="7" text-anchor="middle">에이바우트</text></svg></div>
</body></html>
