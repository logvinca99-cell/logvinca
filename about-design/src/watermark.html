<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>에이바우트 워터마크</title>
<link rel="stylesheet" href="style.css">
<style>
 html,body{background:transparent}
 body{width:250px}
 #wm{display:inline-flex;align-items:center;gap:8px;padding:6px}
 #wm .mark{width:50px;height:50px;border-radius:13px;font-size:47px;padding-bottom:6px;box-shadow:0 0 0 2.5px #fff}
 #wm span.n{font-weight:900;font-size:36px;color:var(--ink);letter-spacing:-.05em;line-height:1;-webkit-text-stroke:5px #fff;paint-order:stroke fill}
 #wm.white .mark{background:#fff;color:var(--plum);box-shadow:0 0 0 1.5px rgba(0,0,0,.2)}
 #wm.white span.n{color:#fff;-webkit-text-stroke:4px rgba(0,0,0,.2)}
</style></head><body>
<div id="wm" class="__VARIANT__"><span class="mark">a<i>.</i></span><span class="n">에이바우트</span></div>
</body></html>
