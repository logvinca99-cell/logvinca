<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>상단 A</title><link rel="stylesheet" href="style.css">
<style>
 .w{padding:34px 40px 36px}
 .bar{display:flex;justify-content:space-between;align-items:center}
 .bar span.dn{font-weight:700;font-size:var(--c);color:var(--plum)}
 .g{margin-top:26px;display:grid;grid-template-columns:1.25fr 1fr;gap:12px}
 .g>div{border-radius:28px;padding:28px 30px 30px;color:#fff}
 .g .k{background:var(--ink)} .g .p{background:var(--plum)}
 .g .num{font-size:26px;color:var(--mark);letter-spacing:.04em}
 .g .s{margin-top:14px;font-weight:700}
 .g .t{margin-top:2px;font-size:44px}
</style></head><body><div class="w">
 <div class="bar"><div class="logo"><span class="mark">a<i>.</i></span><span class="name">에이바우트</span></div><span class="dn">아래 옵션표 ↓</span></div>
 <div class="g">
  <div class="k"><div class="num">CHECK 01</div><div class="s">대표 사진 말고</div><div class="t"><span class="y">옵션명·옵션<br>이미지</span>로 확인</div></div>
  <div class="p"><div class="num">CHECK 02</div><div class="s">받아보시기까지</div><div class="t"><span class="y">약 2주</span><br>걸려요</div></div>
 </div>
</div></body></html>
