<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>상단 B</title><link rel="stylesheet" href="style.css">
<style>
 body{background:var(--tint)}
 .w{padding:34px 40px 34px}
 .bar{display:flex;justify-content:space-between;align-items:center}
 .bar .en{font-size:34px;color:var(--plum)}
 .t{margin-top:26px}
 .g{margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
 .c{background:#fff;border-radius:26px;padding:18px 18px 20px}
 .c.ok{outline:5px solid var(--plum);outline-offset:-5px}
 .ph{height:150px;border-radius:16px;background:#E4E0EA;position:relative;overflow:hidden}
 .no .ph::before,.no .ph::after{content:"";position:absolute;left:-10%;top:50%;width:120%;height:5px;background:#B9B3C2;transform:rotate(22deg)}
 .no .ph::after{transform:rotate(-22deg)}
 .ok .ph{background:none;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
 .ok .ph i{border-radius:12px;background:var(--tint);display:grid;place-items:center;font-style:normal;font-family:"Anton";font-size:34px;color:var(--plum)}
 .ok .ph i:first-child{background:var(--plum);color:var(--mark)}
 .lab{margin-top:14px;display:flex;align-items:center;gap:10px;font-weight:900;font-size:30px;letter-spacing:-.03em}
 .lab b{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:900;color:#fff;background:#B9B3C2}
 .ok .lab b{background:var(--plum)}
 .no .lab{color:var(--gray)}
 .f{margin-top:20px;display:flex;justify-content:space-between;align-items:center;font-weight:700}
 .f em{font-style:normal;color:var(--plum);font-weight:900}
</style></head><body><div class="w">
 <div class="bar"><div class="logo"><span class="mark">a<i>.</i></span><span class="name">에이바우트</span></div><span class="en">before you order</span></div>
 <div class="t">어떤 사진을 보고 고르면 되나요?</div>
 <div class="g">
  <div class="c no"><div class="ph"></div><div class="lab"><b>✕</b>대표 사진</div></div>
  <div class="c ok"><div class="ph"><i>A</i><i>B</i><i>C</i></div><div class="lab"><b>○</b>옵션명·옵션 이미지</div></div>
 </div>
 <div class="f"><span>받아보시기까지 <em>약 2주</em> 걸려요</span><span>아래 옵션표 ↓</span></div>
</div></body></html>
