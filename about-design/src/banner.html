<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>에이바우트 배너</title>
<link rel="stylesheet" href="style.css">
<style>
 html{overflow:hidden}
 body{width:1280px;height:480px;position:relative;border-top:14px solid var(--plum)}
 .l{position:absolute;left:72px;top:60px}
 .l .en{font-size:40px;color:var(--plum)}
 .l .d{margin-top:14px}
 .r{position:absolute;right:72px;top:54px;width:300px;height:300px;background:var(--plum);color:#fff;display:grid;place-items:center;font-size:300px;padding-bottom:44px}
 .r i{color:var(--mark)}
 .tape{position:absolute;left:0;right:0;bottom:0;background:var(--ink);color:#fff;white-space:nowrap;overflow:hidden;padding:8px 0 12px;font-size:30px}
 .tape span{color:var(--mark);margin:0 16px}
</style></head><body>
<div class="l"><div class="en">about your everyday</div><div class="d">일상에 꼭 맞는<br><span class="hl">물건을 찾아서</span></div></div>
<div class="r en"><span>a<i>.</i></span></div>
<div class="tape en">about your home<span>✳</span>about your day<span>✳</span>about your taste<span>✳</span>about your home<span>✳</span>about your day<span>✳</span>about your taste<span>✳</span>about your home</div>
</body></html>
