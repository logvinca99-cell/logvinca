<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>에이바우트 배너</title>
<link rel="stylesheet" href="style.css">
<style>
 html{overflow:hidden}
 body{width:1280px;height:480px;background:var(--dark);color:#fff;position:relative}
 .l{position:absolute;left:90px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center}
 .l .m{color:rgba(255,255,255,.8)}
 .l .xl{margin-top:10px;font-size:88px}
 .l .xl span{color:var(--lilac)}
 .chips{margin-top:32px;display:flex;gap:12px}
 .chips span{border:2px solid var(--lilac);color:var(--lilac);border-radius:999px;padding:8px 26px;font-size:var(--s);font-weight:800}
 .logo{position:absolute;right:120px;top:50%;transform:translateY(-50%)}
</style></head><body>
<div class="l">
 <div class="m">일상에 꼭 맞는 물건을 찾아서</div>
 <div class="xl"><span>에이</span>바우트</div>
 <div class="chips"><span>꼼꼼한 검수</span><span>안전한 포장</span><span>문자 상담</span></div>
</div>
<img class="logo" src="logo-white.svg" width="280" height="280" alt="">
</body></html>
