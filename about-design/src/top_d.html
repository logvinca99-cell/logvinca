<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>상단 D</title><link rel="stylesheet" href="style.css">
<style>
 .w{padding:36px 48px 38px}
 .bar{display:flex;justify-content:space-between;align-items:center}
 .bar .en{font-size:34px;color:var(--plum)}
 .h{margin-top:40px;font-weight:900;font-size:68px;line-height:1.16;letter-spacing:-.05em}
 .h em{font-style:normal;color:var(--plum)}
 .kv{margin-top:34px;border-top:3px solid var(--ink)}
 .kv div{display:grid;grid-template-columns:220px 1fr;padding:16px 0;border-bottom:1px solid var(--hair);align-items:baseline}
 .kv span{color:var(--gray)}
 .kv b{font-weight:900;font-size:32px;letter-spacing:-.03em}
</style></head><body><div class="w">
 <div class="bar"><div class="logo"><span class="mark">a<i>.</i></span><span class="name">에이바우트</span></div><span class="en">before you order</span></div>
 <div class="h">고르기 전에<br><em>두 가지</em>만 봐주세요</div>
 <div class="kv">
  <div><span>발송 기준</span><b>대표 사진이 아닌 옵션명·옵션 이미지</b></div>
  <div><span>받아보시기까지</span><b>약 2주</b></div>
 </div>
</div></body></html>
